name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - head

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
      - name: Run lint
        if: matrix.ruby == '3.4'
        run: bundle exec rake lint
      - name: Build documentation
        if: matrix.ruby == '3.4'
        run: bundle exec rake doc
      - name: Build gem
        if: matrix.ruby == '3.4'
        run: bundle exec gem build openusd.gemspec

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install usd-core==26.8
      - name: Validate generated USDA and USDZ
        run: bundle exec rake compatibility
        env:
          USD_CORE_PYTHON: python3
